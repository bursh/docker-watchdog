name: Publish release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (v1.1.0 or newer)
        required: true
        default: v1.3.0
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - run: python3 -m unittest -v
      - name: Integration and configurator tests (where available)
        run: |
          if test -f tests/integration.sh; then bash tests/integration.sh; fi
          if test -f tests/configurator.test.js; then node --test tests/configurator.test.js; fi
      - run: bash build-deb.sh
      - name: Build RPM where available
        run: |
          if test -f build-rpm.sh; then
            sudo apt-get update
            sudo apt-get install -y rpm
            bash build-rpm.sh
            rpm -K --nosignature dist/*.rpm
          fi
      - name: Validate package versions and generate checksums
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          cd dist
          test "$(dpkg-deb -f ./*.deb Version)" = "${TAG#v}-1"
          if compgen -G './*.rpm' >/dev/null; then
            test "$(rpm -qp --qf '%{VERSION}-%{RELEASE} %{ARCH}' ./*.rpm)" = "${TAG#v}-1 noarch"
          fi
          shopt -s nullglob
          sha256sum ./*.deb ./*.rpm > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: gh release create "$TAG" dist/* --verify-tag --draft --title "$TAG" --notes "Source snapshot $TAG. Review release notes and test results before publishing."
