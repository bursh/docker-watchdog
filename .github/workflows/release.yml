name: Publish release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (v1.1.0 or newer)
        required: true
        default: v1.2.2
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - run: python3 -m unittest -v
      - run: bash build-deb.sh
      - name: Validate package version and generate checksum
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          cd dist
          test "$(dpkg-deb -f ./*.deb Version)" = "${TAG#v}-1"
          sha256sum ./*.deb > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: gh release create "$TAG" dist/*.deb dist/SHA256SUMS --verify-tag --draft --title "$TAG" --notes "Source snapshot $TAG. Review release notes and test results before publishing."
