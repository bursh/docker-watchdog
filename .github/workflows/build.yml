name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 -m unittest -v
      - run: node --test tests/configurator.test.js
      - run: bash tests/integration.sh
      - run: bash build-deb.sh
      - run: dpkg-deb --info dist/*.deb && dpkg-deb --contents dist/*.deb
      - name: Install RPM build tools
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: bash build-rpm.sh
      - name: Validate RPM package
        run: |
          rpm -qp --qf '%{NAME} %{VERSION}-%{RELEASE} %{ARCH}\n' dist/*.rpm
          rpm -K --nosignature dist/*.rpm
          rpm -qpl dist/*.rpm
          rpm -qp --scripts dist/*.rpm
      - name: RPM install and removal smoke test on Fedora
        run: |
          docker run --rm -v "$PWD/dist:/artifacts:ro" fedora:45 sh -exc '
            dnf -y --setopt=tsflags= install /artifacts/*.rpm
            docker-watchdog --version
            test -f /usr/lib/systemd/system/docker-watchdog.service
            test -f /etc/docker-watchdog/watchdog.conf
            find /usr/share/man/man1 -name "docker-watchdog.1*" -print -quit | grep -q .
            rpm -V docker-watchdog
            dnf -y remove docker-watchdog
          '
      - uses: actions/upload-artifact@v4
        with:
          name: docker-watchdog-packages
          path: |
            dist/*.deb
            dist/*.rpm
