[watchdog]
# Seconds between check starts (subject to Docker/worker latency).
interval = 60
# Consecutive failed checks before recovery.
failures = 3
# Seconds to wait after recovery before probing again.
cooldown = 120
# Attempts per rolling window; 0 = unlimited (cooldown still applies).
max_restarts = 3
# Rolling rate-limit window in seconds.
window = 3600
# HTTP timeout per published address, in seconds.
http_timeout = 5
# Timeout per Docker Compose command, in seconds.
command_timeout = 180
# Maximum concurrent project workers.
workers = 32
# Default recovery: restart | down-up | force-recreate | container-restart | container-recreate.
mode = restart
# Optional comma-separated escalation; overrides mode when nonempty.
# recovery = restart,force-recreate,down-up
recovery =
# Grace period after detecting a new container or start timestamp.
startup_grace = 60
# Simulate checks without Docker mutations, hooks or webhooks.
dry_run = false
# DEBUG | INFO | WARNING | ERROR
log_level = INFO
# False logs only transitions to healthy (not every successful check).
log_success = true
# Summary interval in seconds; 0 disables summaries.
summary_interval = 600
# Wake discovery on Docker events; periodic polling remains enabled.
docker_events = true
# Optional HTTPS endpoint accepting JSON {project,event,mode}.
# Use a relay for Slack, Teams or Telegram payload conversion.
webhook_url =
# Prometheus HTTP endpoint on 127.0.0.1; 0 disables it.
metrics_port = 0
# Optional absolute paths to trusted root-managed executable hooks.
# Arguments: project mode result (empty result for pre-hook).
pre_hook =
post_hook =
# Timeout per hook, seconds. Failed pre-hook prevents recovery.
hook_timeout = 30
# Check method: http | healthcheck | both | auto (prefer Docker healthcheck).
check = http
# Consecutive Docker-health failures; 0 inherits failures, 1 reacts immediately.
healthcheck_failures = 0
# Promote recovery when one target reaches its threshold and this many are confirmed failed.
# 0 disables promotion. Explicit project-wide labels must agree across monitored targets.
project_failure_threshold = 2
# Recovery for simultaneous failures: restart | force-recreate | down-up.
project_recovery_mode = restart
